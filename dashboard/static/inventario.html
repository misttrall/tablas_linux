<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario · ETL Dashboard</title>
  <link rel="stylesheet" href="/static/common.css">
</head>
<body>
  <header>
    <h1>ETL Dashboard</h1>
    <div class="userbar" id="userbar"></div>
  </header>
  <main>
    <div class="cards">
      <div class="card"><div class="label">Materiales</div><div class="value" id="invMaterials">-</div></div>
      <div class="card"><div class="label">Valor total</div><div class="value" id="invValue">-</div></div>
      <div class="card"><div class="label">Bajo mínimo</div><div class="value" id="invAlerts">-</div></div>
      <div class="card"><div class="label">Valor en riesgo</div><div class="value" id="invRisk">-</div></div>
    </div>
    <div class="toolbar">
      <select id="fCentro" onchange="inventoryPage(0)"><option value="">Centro: todos</option></select>
      <select id="fAlmacen" onchange="inventoryPage(0)"><option value="">Almacén: todos</option></select>
      <select id="fArea" onchange="inventoryPage(0)"><option value="">Área: todas</option></select>
      <input type="text" id="fSearch" placeholder="Buscar (material, descripción...)" oninput="scheduleSearch()">
      <label class="check"><input type="checkbox" id="fLowOnly" onchange="inventoryPage(0)"> Solo bajo stock</label>
      <button class="btn sync" id="btnSync" onclick="syncNow()">Sincronizar</button>
    </div>
    <div id="syncStatus">-</div>
    <table id="inventory">
      <thead><tr><th>Material</th><th>Descripción</th><th>Centro</th><th>Almacén</th><th>Stock</th><th>Mínimo</th><th>Área</th><th>Valor</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="pager">
      <button id="btnPrev" onclick="inventoryPage(invPage - 1)">‹ Anterior</button>
      <span id="pageInfo">-</span>
      <button id="btnNext" onclick="inventoryPage(invPage + 1)">Siguiente ›</button>
    </div>
  </main>
  <script src="/static/common.js"></script>
  <script>
    const LIMIT = 100;
    let invPage = 0;
    let searchTimer = null;
    let wasRunning = false;
    let currentUser = null;
    let lastSyncInfo = null;

    function formatSyncTime(ts) {
      if (!ts) return null;
      const d = new Date(ts.replace(' ', 'T'));
      return isNaN(d.getTime()) ? null : d.toLocaleString('es-CL');
    }

    function renderSyncStatus() {
      const status = document.getElementById('syncStatus');
      if (!lastSyncInfo) {
        status.textContent = 'Inactivo. Aún no hay sincronizaciones.';
      } else if (lastSyncInfo.end_time) {
        const t = formatSyncTime(lastSyncInfo.end_time);
        status.textContent = 'Inactivo. La última sincronización fue ' + (t || lastSyncInfo.end_time);
      } else {
        status.textContent = 'Inactivo. La última sincronización quedó en ' + lastSyncInfo.status + ' (sin terminar).';
      }
    }

    async function loadLastSync() {
      const res = await api('/api/last-sync');
      const ex = await res.json();
      lastSyncInfo = ex && ex.id ? ex : null;
      renderSyncStatus();
    }

    async function init() {
      currentUser = await bootPage(['user', 'admin']);
      if (!currentUser) return;
      renderUserbar(currentUser);
      loadInventory();
      loadFilters();
      loadItems();
      loadLastSync();
      refreshLive();
      setInterval(refreshLive, 2000);
      setInterval(function () { loadInventory(); loadFilters(); loadItems(); loadLastSync(); }, 60000);
    }

    async function refreshLive() {
      const res = await api('/api/live');
      const l = await res.json();
      const btn = document.getElementById('btnSync');
      const status = document.getElementById('syncStatus');
      if (l.running) {
        wasRunning = true;
        btn.disabled = true;
        status.textContent = 'Sincronizando… fase ' + l.phase +
          (l.table ? ' · ' + l.table : '') + ' · ' + (l.rows_so_far || 0) + ' filas';
        return;
      }
      if (wasRunning) {
        wasRunning = false;
        btn.disabled = false;
        const ex = await api('/api/last-sync').then(r => r.json());
        lastSyncInfo = ex;
        const recent = ex && ex.end_time &&
          (new Date() - new Date(ex.end_time.replace(' ', 'T'))) < 300000;
        if (recent && ex.status === 'failed') {
          status.textContent = 'La sincronización #' + ex.id + ' falló. Revisa logs/etl_sync.log y vuelve a intentar.';
        } else {
          status.textContent = 'Sincronización #' + ex.id + ' ' + ex.status + ' a las ' +
            (formatSyncTime(ex.end_time) || ex.end_time || '—');
        }
        loadInventory();
        loadItems();
      } else {
        btn.disabled = false;
        renderSyncStatus();
      }
    }

    async function loadInventory() {
      const res = await api('/api/inventory');
      const inv = await res.json();
      if (!inv.available) {
        document.getElementById('invMaterials').textContent = 'n/d';
        document.getElementById('invValue').textContent = 'n/d';
        document.getElementById('invAlerts').textContent = 'n/d';
        document.getElementById('invRisk').textContent = 'n/d';
        return;
      }
      document.getElementById('invMaterials').textContent = inv.total_materials;
      document.getElementById('invValue').textContent = formatMoney(inv.total_value);
      document.getElementById('invAlerts').textContent = inv.alerts_count;
      document.getElementById('invRisk').textContent = formatMoney(inv.risk_value);
    }

    function setFilterOptions(id, values) {
      const sel = document.getElementById(id);
      const keep = sel.value;
      sel.innerHTML = '<option value="">' +
        (id === 'fArea' ? 'Área: todas' : id === 'fAlmacen' ? 'Almacén: todos' : 'Centro: todos') +
        '</option>' +
        values.map(v => '<option value="' + v + '">' + v + '</option>').join('');
      if (keep && values.indexOf(keep) >= 0) { sel.value = keep; }
    }

    async function loadFilters() {
      const res = await api('/api/inventory/filters');
      const data = await res.json();
      if (!data.available) return;
      setFilterOptions('fCentro', data.centro || []);
      setFilterOptions('fAlmacen', data.almacen || []);
      setFilterOptions('fArea', data.area || []);
    }

    function invQuery() {
      const p = new URLSearchParams();
      const c = document.getElementById('fCentro').value;
      const a = document.getElementById('fAlmacen').value;
      const ar = document.getElementById('fArea').value;
      const q = document.getElementById('fSearch').value.trim();
      const lo = document.getElementById('fLowOnly').checked;
      if (c) p.set('centro', c);
      if (a) p.set('almacen', a);
      if (ar) p.set('area', ar);
      if (q) p.set('q', q);
      if (lo) p.set('low_only', 'true');
      p.set('limit', LIMIT);
      p.set('offset', invPage * LIMIT);
      return p;
    }

    async function loadItems() {
      const res = await api('/api/inventory/items?' + invQuery().toString());
      const data = await res.json();
      if (!data.available) {
        document.querySelector('#inventory tbody').innerHTML =
          '<tr><td colspan="8">Sin datos de inventario derivado</td></tr>';
        document.getElementById('pageInfo').textContent = '-';
        return;
      }
      const tb = document.querySelector('#inventory tbody');
      tb.innerHTML = data.rows.map(r => {
        const qty = r.StockLibre !== '' && r.StockLibre !== null ? Number(r.StockLibre) : NaN;
        const min = r.stock_minimo !== '' && r.stock_minimo !== null ? Number(r.stock_minimo) : NaN;
        const low = !isNaN(qty) && !isNaN(min) && qty < min;
        return '<tr' + (low ? ' class="low"' : '') + '><td>' +
          (r.MATNR || r.Columna1 || '') + '</td><td>' +
          (r.Descripcion || r.DescripcionMaterial || '') + '</td><td>' +
          (r.Centro || '') + '</td><td>' + (r.AlmacenDesc || r.Almacen || r.NumeroAlmacen || '') +
          '</td><td>' + (r.StockLibre !== '' ? r.StockLibre : r.Stock) + '</td><td>' +
          (r.stock_minimo !== '' ? r.stock_minimo : '') + '</td><td>' +
          (r.Area || '') + '</td><td>' + formatMoney(Number(r.ValorTotal) || 0) + '</td></tr>';
      }).join('');

      const lo = document.getElementById('fLowOnly').checked;
      document.getElementById('pageInfo').textContent =
        'Página ' + (invPage + 1) + ' · ' + data.total + ' resultados' +
        (lo ? ' (bajo stock: ' + data.low_only_count + ')' : '');
      document.getElementById('btnPrev').disabled = invPage === 0;
      document.getElementById('btnNext').disabled = invPage * LIMIT + data.rows.length >= data.total;
    }

    function inventoryPage(page) {
      if (page < 0) return;
      invPage = page;
      loadItems();
    }

    function scheduleSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { inventoryPage(0); }, 400);
    }

    async function syncNow() {
      const btn = document.getElementById('btnSync');
      btn.disabled = true;
      document.getElementById('syncStatus').textContent = 'Disparando ETL…';
      const res = await api('/api/etl/trigger', { method: 'POST' });
      const data = await res.json();
      if (!data.ok) {
        document.getElementById('syncStatus').textContent =
          (data.reason === 'already_running')
            ? 'Ya hay una corrida en curso (run #' + (data.run_id || '?') + ').'
            : 'No se pudo disparar el ETL: ' + (data.reason || 'desconocido');
        btn.disabled = false;
      }
    }

    init();
  </script>
</body>
</html>
