# Novus ETL + Dashboard + Timer en Docker.
#
# Uso básico:
#   docker compose build
#   docker compose up -d
#   docker compose logs -f
#
# Comandos CLI dentro del contenedor:
#   docker compose exec etl runuser -u etl -- /opt/etl/tablas_linux/venv/bin/python -m cli run --config /opt/etl/tablas_linux/config.json
#   docker compose exec etl runuser -u etl -- /opt/etl/tablas_linux/venv/bin/python -m cli reporte --config /opt/etl/tablas_linux/config.json
#   docker compose exec etl runuser -u etl -- /opt/etl/tablas_linux/venv/bin/python -m cli bi export --config /opt/etl/tablas_linux/config.json
#   docker compose exec etl runuser -u etl -- /opt/etl/tablas_linux/venv/bin/python -m cli license inspect --config /opt/etl/tablas_linux/config.json

services:
  etl:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: novus-etl:latest
    container_name: novus-etl-app
    restart: unless-stopped
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./config.json:/etc/etl/config.json:ro
      - ./data:/var/lib/etl
      - ./logs:/var/lib/etl/logs
      - ./output:/var/lib/etl/output
      - /opt/sap/nwrfcsdk:/opt/sap/nwrfcsdk:ro
    ports:
      - "${ETL_PORT:-8000}:8000"
    environment:
      - TZ=${TZ:-America/Santiago}
      - ENVIRONMENT=${ENVIRONMENT:-prd}
