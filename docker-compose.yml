# Novus IT · Data Platform & ETL Dashboard
# Despliegue en Docker
#
# Comandos rápidos:
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#

services:
  etl-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: novus-etl-platform:latest
    container_name: novus-etl-app
    restart: unless-stopped
    volumes:
      - ./config.json:/opt/etl/config.json:ro
      - ./data:/opt/etl/data
      - ./logs:/opt/etl/logs
      - ./output:/opt/etl/output
    ports:
      - "${PORT:-8001}:8000"
    environment:
      - TZ=${TZ:-America/Santiago}
      - ENVIRONMENT=${ENVIRONMENT:-prd}
      - ETL_SECRET=${ETL_SECRET:-}
